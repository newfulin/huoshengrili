[package]
name = "calendar-planner"
version = "0.1.0"
description = "Local desktop monthly calendar planner"
authors = ["AI Company"]
edition = "2021"

[lib]
name = "calendar_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
